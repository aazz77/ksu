name: Build Release APK

# 每次 push / 手动触发时编译 release 版 APK 并上传。
# 签名：在仓库 Settings -> Secrets and variables -> Actions 中配置下面 4 个 secret：
#   KEYSTORE           : 签名 keystore(.jks) 文件 base64 编码后的字符串
#                        生成: keytool -genkeypair -alias <别名> -keyalg RSA -keysize 2048 \
#                              -validity 10000 -keystore key.jks && base64 -w 0 key.jks
#   KEYSTORE_PASSWORD  : keystore 密码
#   KEY_ALIAS          : key 别名 (上面 -alias 的值)
#   KEY_PASSWORD       : key 密码
# 若未配置 KEYSTORE，则回退为临时签名（每次构建自动生成，仅用于验证，不可用于升级安装）。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
      
    



      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "Using repository signing secrets."
            echo "$KEYSTORE" | base64 -d > signing.jks
            {
              echo "KEYSTORE_FILE=signing.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> gradle.properties
          else
            echo "No KEYSTORE secret found, generating a temporary keystore."
            TMP_PASS=$(openssl rand -hex 16)
            keytool -genkeypair \
              -alias temp-key \
              -keyalg RSA -keysize 2048 \
              -validity 3650 \
              -storepass "$TMP_PASS" \
              -keypass "$TMP_PASS" \
              -dname "CN=KernelSU CI Build" \
              -storetype JKS \
              -keystore signing.jks
            {
              echo "KEYSTORE_FILE=signing.jks"
              echo "KEYSTORE_PASSWORD=$TMP_PASS"
              echo "KEY_ALIAS=temp-key"
              echo "KEY_PASSWORD=$TMP_PASS"
            } >> gradle.properties
          fi

    
      - name: Build release APK
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Collect APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found!" >&2
            exit 1
          fi
          cp "$APK" "KernelSU-Manager-release.apk"
          echo "path=KernelSU-Manager-release.apk" >> $GITHUB_OUTPUT
          echo "APK built: $APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # 若打了 tag，自动把 APK 挂到该 tag 对应的 Release 上。
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
